services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: noonas_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
    environment:
      DATABASE_URL: ${DATABASE_URL}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    networks:
      - red_app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: noonas_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - red_app

  db:
    image: postgres:15
    container_name: noonas_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - red_app

volumes:
  pgdata:
  uploads_data:

networks:
  red_app:
    name: red_app
    driver: bridge
