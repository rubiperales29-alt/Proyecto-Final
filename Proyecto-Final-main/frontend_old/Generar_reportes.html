<title>Nonna - Generar Reportes</title>
<style>
    /* Modal animations */
    .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1000;
        align-items: center;
        justify-content: center;
    }

    .modal-overlay.active {
        display: flex;
    }

    .modal-content {
        animation: modalFadeIn 0.3s ease-out;
    }

    @keyframes modalFadeIn {
        from {
            opacity: 0;
            transform: scale(0.9);
        }
        to {
            opacity: 1;
            transform: scale(1);
        }
    }

    /* Modal for compra ID */
    .modal-compra-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1000;
        align-items: center;
        justify-content: center;
    }

    .modal-compra-overlay.active {
        display: flex;
    }

    /* Loading spinner */
    .loading-spinner {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 2px solid #ffffff;
        border-radius: 50%;
        border-top-color: transparent;
        animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    /* Loading spinner for verification */
    .loading-spinner-small {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid #4A0E0E;
        border-radius: 50%;
        border-top-color: transparent;
        animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    /* Toast notification */
    .toast {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: #4A0E0E;
        color: white;
        padding: 12px 20px;
        border-radius: 8px;
        z-index: 1100;
        animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
        from {
            transform: translateX(100%);
            opacity: 0;
        }
        to {
            transform: translateX(0);
            opacity: 1;
        }
    }

    /* Input error styling */
    .input-error {
        border-color: #dc2626 !important;
        background-color: #fef2f2 !important;
    }

    .error-message {
        color: #dc2626;
        font-size: 0.875rem;
        margin-top: 0.25rem;
        display: none;
    }

    .error-message.active {
        display: block;
    }

    /* Alert message styling */
    .alert-message {
        background-color: #fee2e2;
        border-left: 4px solid #dc2626;
        color: #991b1b;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 16px;
        font-size: 0.875rem;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .alert-message .material-symbols-outlined {
        font-size: 20px;
    }
</style>
</head>

<script>
    let currentReportType = null;

    const API_BASE_URL = 'http://3.15.13.161:8000/api/reportes';

    function getTodayString() {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');

        return `${year}-${month}-${day}`;
    }

    function getDefaultStartDateString() {
        const date = new Date();
        date.setDate(date.getDate() - 30);

        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');

        return `${year}-${month}-${day}`;
    }

    function getReportTitle(reportType) {
        switch (reportType) {
            case 'ventas':
                return 'Reporte de Ventas';
            case 'compras':
                return 'Reporte de Compras';
            case 'pedidos':
                return 'Reporte de Pedidos';
            default:
                return 'Generar Reporte';
        }
    }

    function showModal(reportType) {
        currentReportType = reportType;

        const modal = document.getElementById('reportModal');
        const modalTitle = document.getElementById('modalTitle');
        const startDateInput = document.getElementById('startDateInput');
        const endDateInput = document.getElementById('endDateInput');

        modalTitle.textContent = getReportTitle(reportType);

        const today = getTodayString();

        startDateInput.max = today;
        endDateInput.max = today;

        startDateInput.value = getDefaultStartDateString();
        endDateInput.value = today;

        modal.classList.add('active');
    }

    function closeModal() {
        const modal = document.getElementById('reportModal');

        modal.classList.remove('active');
        currentReportType = null;
    }

    function showCompraModal() {
        const modal = document.getElementById('compraModal');
        resetCompraForm();
        modal.classList.add('active');
        document.getElementById('compraIdInput').focus();
    }

    function closeCompraModal() {
        const modal = document.getElementById('compraModal');
        modal.classList.remove('active');
        resetCompraForm();
    }

    function resetCompraForm() {
        const compraIdInput = document.getElementById('compraIdInput');
        const errorMessage = document.getElementById('idErrorMessage');
        const alertContainer = document.getElementById('compraAlertContainer');
        const resetBtn = document.getElementById('resetCompraBtn');
        const generateBtn = document.getElementById('generateCompraBtn');
        
        compraIdInput.value = '';
        compraIdInput.classList.remove('input-error');
        compraIdInput.disabled = false;
        errorMessage.classList.remove('active');
        errorMessage.textContent = '';
        alertContainer.innerHTML = '';
        resetBtn.style.display = 'none';
        generateBtn.style.display = 'block';
        generateBtn.disabled = false;
        generateBtn.innerHTML = 'Generar Reporte';
    }

    function resetAndCloseCompraModal() {
        closeCompraModal();
    }

    function showToast(message, isError = false) {
        const toast = document.createElement('div');

        toast.className = 'toast';
        toast.style.backgroundColor = isError ? '#dc2626' : '#4A0E0E';
        toast.innerHTML = message;

        document.body.appendChild(toast);

        setTimeout(() => {
            toast.remove();
        }, 3000);
    }

    function showErrorAlert(containerId, message) {
        const container = document.getElementById(containerId);
        container.innerHTML = `
            <div class="alert-message">
                <span class="material-symbols-outlined">error</span>
                <span>${message}</span>
            </div>
        `;
    }

    function showSuccessAlert(containerId, message) {
        const container = document.getElementById(containerId);
        container.innerHTML = `
            <div class="alert-message" style="background-color: #e6f4ea; border-left-color: #34a853; color: #137333;">
                <span class="material-symbols-outlined">check_circle</span>
                <span>${message}</span>
            </div>
        `;
    }

    function showPedidoModal() {
        const modal = document.getElementById('pedidoModal');
        resetPedidoForm();
        modal.classList.add('active');
        document.getElementById('pedidoIdInput').focus();
    }

    function closePedidoModal() {
        const modal = document.getElementById('pedidoModal');
        modal.classList.remove('active');
        resetPedidoForm();
    }

    function resetPedidoForm() {
        const pedidoIdInput = document.getElementById('pedidoIdInput');
        const errorMessage = document.getElementById('pedidoIdErrorMessage');
        const alertContainer = document.getElementById('pedidoAlertContainer');
        const resetBtn = document.getElementById('resetPedidoBtn');
        const generateBtn = document.getElementById('generatePedidoBtn');
        
        pedidoIdInput.value = '';
        pedidoIdInput.classList.remove('input-error');
        pedidoIdInput.disabled = false;
        errorMessage.classList.remove('active');
        errorMessage.textContent = '';
        alertContainer.innerHTML = '';
        resetBtn.style.display = 'none';
        generateBtn.style.display = 'block';
        generateBtn.disabled = false;
        generateBtn.innerHTML = 'Generar Reporte';
    }

    function resetAndClosePedidoModal() {
        closePedidoModal();
    }

    function validatePedidoIdFormat(pedidoId) {
        const errorMessage = document.getElementById('pedidoIdErrorMessage');
        const pedidoIdInput = document.getElementById('pedidoIdInput');

        if (!pedidoId || pedidoId.trim() === '') {
            errorMessage.textContent = 'Por favor, ingresa el ID del pedido';
            errorMessage.classList.add('active');
            pedidoIdInput.classList.add('input-error');
            return false;
        }

        if (!/^\d+$/.test(pedidoId)) {
            errorMessage.textContent = 'El ID debe contener solo números';
            errorMessage.classList.add('active');
            pedidoIdInput.classList.add('input-error');
            return false;
        }

        const idNumber = parseInt(pedidoId, 10);

        if (idNumber <= 0) {
            errorMessage.textContent = 'El ID debe ser un número positivo mayor que cero';
            errorMessage.classList.add('active');
            pedidoIdInput.classList.add('input-error');
            return false;
        }

        errorMessage.classList.remove('active');
        pedidoIdInput.classList.remove('input-error');
        errorMessage.textContent = '';

        return true;
    }

    async function checkPedidoExists(pedidoId) {
        try {
            const url = `${API_BASE_URL}/pedido/${pedidoId}`;

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 10000);

            const response = await fetch(url, {
                method: 'GET',
                signal: controller.signal
            });

            clearTimeout(timeoutId);

            if (response.ok) {
                return { exists: true, error: null };
            }

            if (response.status === 404) {
                return { exists: false, error: '❌ El ID de pedido no existe en la base de datos. Por favor, verifica el número e intenta nuevamente.' };
            }

            return { exists: false, error: `⚠️ No se encontro el pedido.` };

        } catch (error) {
            console.error('Error verificando pedido:', error);

            if (error.name === 'AbortError') {
                return { exists: false, error: '⏱️ La solicitud ha excedido el tiempo de espera. Verifica tu conexión.' };
            }

            return { exists: false, error: '🔌 Error de conexión. No se pudo verificar el ID. Revisa tu red.' };
        }
    }

    async function generatePedidoReport() {
        const pedidoIdInput = document.getElementById('pedidoIdInput');
        const generateBtn = document.getElementById('generatePedidoBtn');
        const errorMessage = document.getElementById('pedidoIdErrorMessage');
        const alertContainer = document.getElementById('pedidoAlertContainer');
        const resetBtn = document.getElementById('resetPedidoBtn');

        let pedidoId = pedidoIdInput.value.trim();

        // Limpiar alertas previas
        alertContainer.innerHTML = '';
        errorMessage.classList.remove('active');
        pedidoIdInput.classList.remove('input-error');

        if (!validatePedidoIdFormat(pedidoId)) {
            return;
        }

        const idNumber = parseInt(pedidoId, 10);

        const originalText = generateBtn.innerHTML;
        generateBtn.innerHTML = '<span class="loading-spinner"></span> Verificando ID...';
        generateBtn.disabled = true;

        try {
            const checkResult = await checkPedidoExists(idNumber);

            if (!checkResult.exists) {
                // Mostrar alerta de error
                showErrorAlert('pedidoAlertContainer', checkResult.error);
                pedidoIdInput.classList.add('input-error');
                
                // Mostrar botón de reintento y ocultar el de generar temporalmente
                generateBtn.style.display = 'none';
                resetBtn.style.display = 'block';
                
                showToast(checkResult.error, true);
                return;
            }

         
            
            const url = `${API_BASE_URL}/pedido/${idNumber}`;
            
            // Pequeña pausa para mostrar el mensaje de éxito
            setTimeout(() => {
                const newWindow = window.open(url, '_blank');

                if (newWindow) {
                    showToast(`📄 Abriendo reporte de pedido #${idNumber}...`);
                    setTimeout(() => {
                        closePedidoModal();
                    }, 500);
                } else {
                    showToast('⚠️ Por favor, permite ventanas emergentes para ver el reporte', true);
                }
            }, 800);

        } catch (error) {
            console.error('Error al generar el reporte:', error);
            showErrorAlert('pedidoAlertContainer', '❌ Error inesperado al generar el reporte. Intenta nuevamente.');
            showToast('Error al generar el reporte', true);
            
            generateBtn.style.display = 'none';
            resetBtn.style.display = 'block';
        } finally {
            generateBtn.innerHTML = originalText;
            generateBtn.disabled = false;
        }
    }

    function validateDateRange(fechaInicio, fechaFin) {
        const today = getTodayString();

        if (!fechaInicio || !fechaFin) {
            showToast('Por favor, selecciona ambas fechas', true);
            return false;
        }

        if (fechaInicio > today || fechaFin > today) {
            showToast('Las fechas no pueden ser futuras', true);
            return false;
        }

        if (fechaInicio > fechaFin) {
            showToast('La fecha de inicio debe ser anterior o igual a la fecha de fin', true);
            return false;
        }

        return true;
    }

    function generateInventarioReport() {
        const url = `${API_BASE_URL}/inventario`;

        window.open(url, '_blank');
        showToast('Abriendo reporte de inventario...');
    }

    async function generateReport() {
        const startDateInput = document.getElementById('startDateInput');
        const endDateInput = document.getElementById('endDateInput');
        const generateBtn = document.getElementById('generateBtn');

        const fechaInicio = startDateInput.value;
        const fechaFin = endDateInput.value;

        if (!currentReportType) {
            showToast('Error: Tipo de reporte no especificado', true);
            return;
        }

        if (!validateDateRange(fechaInicio, fechaFin)) {
            return;
        }

        const originalText = generateBtn.innerHTML;
        generateBtn.innerHTML = '<span class="loading-spinner"></span> Generando...';
        generateBtn.disabled = true;

        try {
            let url = '';

            switch (currentReportType) {
                case 'ventas':
                    url = `${API_BASE_URL}/ventas?fecha_inicio=${fechaInicio}&fecha_fin=${fechaFin}`;
                    break;
                case 'compras':
                    url = `${API_BASE_URL}/compras?fecha_inicio=${fechaInicio}&fecha_fin=${fechaFin}`;
                    break;
                case 'pedidos':
                    url = `${API_BASE_URL}/pedidos?fecha_inicio=${fechaInicio}&fecha_fin=${fechaFin}`;
                    break;
                default:
                    throw new Error('Tipo de reporte no válido');
            }

            window.open(url, '_blank');
            showToast(`Abriendo reporte de ${currentReportType}...`);
            closeModal();

        } catch (error) {
            console.error('Error:', error);
            showToast('Error al generar el reporte. Por favor, intenta nuevamente.', true);
        } finally {
            generateBtn.innerHTML = originalText;
            generateBtn.disabled = false;
        }
    }

    function validateCompraIdFormat(compraId) {
        const errorMessage = document.getElementById('idErrorMessage');
        const compraIdInput = document.getElementById('compraIdInput');
        
        if (!compraId || compraId.trim() === '') {
            errorMessage.textContent = 'Por favor, ingresa el ID de la compra';
            errorMessage.classList.add('active');
            compraIdInput.classList.add('input-error');
            return false;
        }
        
        if (!/^\d+$/.test(compraId)) {
            errorMessage.textContent = 'El ID debe contener solo números (sin letras, espacios o símbolos)';
            errorMessage.classList.add('active');
            compraIdInput.classList.add('input-error');
            return false;
        }
        
        const idNumber = parseInt(compraId, 10);
        if (idNumber <= 0) {
            errorMessage.textContent = 'El ID debe ser un número positivo mayor que cero';
            errorMessage.classList.add('active');
            compraIdInput.classList.add('input-error');
            return false;
        }
        
        errorMessage.classList.remove('active');
        compraIdInput.classList.remove('input-error');
        errorMessage.textContent = '';
        
        return true;
    }

    async function checkCompraExists(compraId) {
        try {
            const url = `${API_BASE_URL}/compra/${compraId}`;
            
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 10000);
            
            const response = await fetch(url, {
                method: 'GET',
                signal: controller.signal
            });
            
            clearTimeout(timeoutId);
            
            if (response.ok) {
                return { exists: true, error: null };
            }
            
            if (response.status === 404) {
                return { exists: false, error: '❌ El ID de compra no existe en la base de datos. Por favor, verifica el número e intenta nuevamente.' };
            }
            
            return { exists: false, error: `⚠️ Error al encontrar la compra ` };
            
        } catch (error) {
            console.error('Error verificando compra:', error);
            
            if (error.name === 'AbortError') {
                return { exists: false, error: '⏱️ La solicitud ha excedido el tiempo de espera. Verifica tu conexión.' };
            }
            
            return { exists: false, error: '🔌 Error de conexión. No se pudo verificar el ID. Revisa tu red.' };
        }
    }

    async function generateCompraReport() {
        const compraIdInput = document.getElementById('compraIdInput');
        const generateBtn = document.getElementById('generateCompraBtn');
        const errorMessage = document.getElementById('idErrorMessage');
        const alertContainer = document.getElementById('compraAlertContainer');
        const resetBtn = document.getElementById('resetCompraBtn');
        
        let compraId = compraIdInput.value.trim();

        // Limpiar alertas previas
        alertContainer.innerHTML = '';
        errorMessage.classList.remove('active');
        compraIdInput.classList.remove('input-error');

        if (!validateCompraIdFormat(compraId)) {
            return;
        }

        const idNumber = parseInt(compraId, 10);
        
        const originalText = generateBtn.innerHTML;
        generateBtn.innerHTML = '<span class="loading-spinner"></span> Verificando ID...';
        generateBtn.disabled = true;

        try {
            const checkResult = await checkCompraExists(idNumber);
            
            if (!checkResult.exists) {
                // Mostrar alerta de error
                showErrorAlert('compraAlertContainer', checkResult.error);
                compraIdInput.classList.add('input-error');
                
                // Mostrar botón de reintento y ocultar el de generar temporalmente
                generateBtn.style.display = 'none';
                resetBtn.style.display = 'block';
                
                showToast(checkResult.error, true);
                return;
            }
            
      
            
            const url = `${API_BASE_URL}/compra/${idNumber}`;
            
            // Pequeña pausa para mostrar el mensaje de éxito
            setTimeout(() => {
                const newWindow = window.open(url, '_blank');
                
                if (newWindow) {
                    showToast(`📄 Abriendo reporte de compra #${idNumber}...`);
                    setTimeout(() => {
                        closeCompraModal();
                    }, 500);
                } else {
                    showToast('⚠️ Por favor, permite ventanas emergentes para ver el reporte', true);
                }
            }, 800);

        } catch (error) {
            console.error('Error al generar el reporte:', error);
            showErrorAlert('compraAlertContainer', '❌ Error inesperado al generar el reporte. Intenta nuevamente.');
            showToast('Error al generar el reporte', true);
            
            generateBtn.style.display = 'none';
            resetBtn.style.display = 'block';
        } finally {
            generateBtn.innerHTML = originalText;
            generateBtn.disabled = false;
        }
    }

    // Cerrar modal de fechas al hacer clic fuera
    document.getElementById('reportModal').addEventListener('click', function(e) {
        if (e.target === this) {
            closeModal();
        }
    });

    // Cerrar modal de compra al hacer clic fuera
    document.getElementById('compraModal').addEventListener('click', function(e) {
        if (e.target === this) {
            closeCompraModal();
        }
    });

    // Validación en tiempo real para el input del ID de compra
    document.getElementById('compraIdInput').addEventListener('input', function(e) {
        const value = e.target.value;
        const errorMessage = document.getElementById('idErrorMessage');
        const compraIdInput = document.getElementById('compraIdInput');
        const alertContainer = document.getElementById('compraAlertContainer');
        
        // Limpiar alerta al empezar a escribir
        alertContainer.innerHTML = '';
        
        // Permitir solo números mientras escribe
        if (value && !/^\d*$/.test(value)) {
            e.target.value = value.replace(/[^\d]/g, '');
        }
        
        // Si el campo está vacío o tiene valor, limpiar error al escribir
        if (errorMessage.classList.contains('active')) {
            errorMessage.classList.remove('active');
            compraIdInput.classList.remove('input-error');
        }
    });

    // Enter key para el modal de fechas
    document.getElementById('startDateInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            generateReport();
        }
    });

    document.getElementById('endDateInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            generateReport();
        }
    });

    // Enter key para el modal de compra
    document.getElementById('compraIdInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            generateCompraReport();
        }
    });

    document.getElementById('pedidoModal').addEventListener('click', function(e) {
        if (e.target === this) {
            closePedidoModal();
        }
    });

    document.getElementById('pedidoIdInput').addEventListener('input', function(e) {
        const value = e.target.value;
        const errorMessage = document.getElementById('pedidoIdErrorMessage');
        const pedidoIdInput = document.getElementById('pedidoIdInput');
        const alertContainer = document.getElementById('pedidoAlertContainer');
        
        // Limpiar alerta al empezar a escribir
        alertContainer.innerHTML = '';

        if (value && !/^\d*$/.test(value)) {
            e.target.value = value.replace(/[^\d]/g, '');
        }

        if (errorMessage.classList.contains('active')) {
            errorMessage.classList.remove('active');
            pedidoIdInput.classList.remove('input-error');
        }
    });

    document.getElementById('pedidoIdInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            generatePedidoReport();
        }
    });
</script>

</body>
</html>
